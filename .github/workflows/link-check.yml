name: Link Check

# Keeps the "real, verified links only" rule honest by checking every
# link in the Markdown files. Runs on pushes, pull requests, and weekly
# (external sites go dead over time even when nothing in the repo changed).

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 13 * * 1" # Mondays

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --accept 200,206,429
            './**/*.md'
          fail: true
